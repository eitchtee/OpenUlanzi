name: Build release

# Attaches the Windows installer and portable build to a release. Publishing a release runs this;
# run it by hand with a tag to rebuild an existing release, which replaces its files.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the existing release, like v1.0.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the release exists
        shell: pwsh
        run: gh release view "$env:TAG" --repo "$env:GITHUB_REPOSITORY" --json tagName

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check the tag matches the app version
        shell: pwsh
        run: |
          $version = (Get-Content app/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:TAG -ne "v$version") { throw "Tag $env:TAG does not match app version $version" }
          "VERSION=$version" >> $env:GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        shell: pwsh
        working-directory: app
        run: npx --yes @tauri-apps/cli@2.12.4 build --bundles nsis

      - name: Attach to the release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/bundle/nsis/*-setup.exe "dist/OpenUlanzi-$env:VERSION-setup.exe"
          Copy-Item target/release/openulanzi-app.exe "dist/OpenUlanzi-$env:VERSION-portable.exe"
          gh release upload "$env:TAG" (Get-ChildItem dist).FullName --clobber --repo "$env:GITHUB_REPOSITORY"
