[package]
name = "openulanzi-app"
version = "1.4.0"
edition = "2024"
description = "Desktop app for OpenUlanzi"
license = "MIT"
repository = "https://github.com/eitchtee/OpenUlanzi"

[dependencies]
openulanzi = { path = ".." }
serde = "1"
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }
