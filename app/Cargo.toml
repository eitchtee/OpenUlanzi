[package]
name = "openulanzi-app"
version = "1.5.1"
edition = "2024"
description = "Desktop app for OpenUlanzi"
license = "MIT"
repository = "https://github.com/eitchtee/OpenUlanzi"

[dependencies]
openulanzi = { path = ".." }
serde = "1"
serde_json = "1"
# macos-private-api lets the volume popup be see-through on macOS; it does nothing elsewhere.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }
